[package]
name = "platform-auth"
description = "OIDC token verification and attribute-based access control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
platform-common.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
utoipa.workspace = true
uuid.workspace = true
base64 = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }

[features]
# Token minting helpers for tests in this and downstream crates.
testing = ["dep:base64", "dep:rcgen"]

[dev-dependencies]
axum.workspace = true
platform-auth = { path = ".", features = ["testing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }

[lints]
workspace = true
