# Weekly dependency update PRs. NIST 800-53 Rev5: SI-2 (flaw remediation),
# RA-5 (vulnerability monitoring), SR-3 (supply chain controls).
#
# Every update still goes through CI (cargo-deny, cargo audit, npm audit,
# tests). npm updates must respect the project rule of exact versions at
# least two weeks old, so the cooldown below delays new releases by 14 days.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      cargo-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    versioning-strategy: increase
    groups:
      npm-minor:
        update-types: [minor, patch]
    ignore:
      # Keep the Node types on the major that CI and `engines` run (22).
      # Raise this together with `node-version` in ci.yml.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14

  - package-ecosystem: docker
    directory: /deployments/container
    schedule:
      interval: weekly
    cooldown:
      default-days: 14

  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: monthly
    ignore:
      # Majors of shared crates come from the root entry, which updates the
      # workspace Cargo.toml and both lockfiles. A major raised from here
      # edits the root Cargo.toml without the root Cargo.lock, which breaks
      # the --locked container build (seen on the utoipa 6 PR).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
