name: fuzz-nightly

# Continuous fuzzing: every target for 10 minutes each night, keeping the
# corpus between runs. Crashes fail the job and are uploaded.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - uses: actions/cache@v6
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Seed the corpus
        run: |
          for d in fuzz/seeds/*/; do
            t=$(basename "$d"); mkdir -p "fuzz/corpus/$t"; cp -n "$d"* "fuzz/corpus/$t/" || true
          done
      - name: Fuzz every target for 10 minutes
        working-directory: fuzz
        run: |
          for t in $(cargo +nightly fuzz list); do
            mkdir -p "corpus/$t"
            cargo +nightly fuzz run "$t" "corpus/$t" -- -max_total_time=600 -rss_limit_mb=2048 -timeout=10
            cargo +nightly fuzz cmin "$t" "corpus/$t" >/dev/null 2>&1 || true
          done
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
