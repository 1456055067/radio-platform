name: docs

# Builds the Zensical documentation site (docs/, zensical.toml) and checks
# its internal links on every pull request that touches it. Pushes to main
# publish it to GitHub Pages (Settings → Pages → Source: GitHub Actions).

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
      - ".github/scripts/check_site_links.py"
  pull_request:
    paths:
      - "docs/**"
      - "zensical.toml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
      - ".github/scripts/check_site_links.py"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; never cancel a deployment part-way.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install Zensical (pinned)
        run: pip install -r requirements-docs.txt
      - name: Build
        run: zensical build --clean
      - name: Check internal links and anchors
        run: python -I .github/scripts/check_site_links.py site
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
