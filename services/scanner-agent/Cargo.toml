[package]
name = "scanner-agent"
description = "Site agent: manages local SDS200 scanners and connects to the gateway over mTLS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "scanner-agent"
path = "src/main.rs"

[dependencies]
platform-common.workspace = true
scanner-controller.workspace = true
scanner-telemetry.workspace = true
uniden-sds.workspace = true
uniden-protocol.workspace = true
scanner-audio.workspace = true
ipnet.workspace = true
futures-util.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"] }
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
api-gateway.workspace = true
platform-auth = { workspace = true, features = ["testing"] }
platform-storage.workspace = true
sds-simulator.workspace = true
axum.workspace = true
http-body-util = "0.1"
rcgen.workspace = true
tower.workspace = true
sqlx.workspace = true
media-gateway.workspace = true
scanner-recorder.workspace = true
scanner-transcription.workspace = true
str0m = { version = "=0.25.0", default-features = false, features = ["aws-lc-rs"] }

[lints]
workspace = true
