apiVersion: v1
kind: Service
metadata:
  name: {{ include "rp.fullname" . }}
  labels: {{- include "rp.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "rp.selector" . | nindent 4 }}
  ports:
    - { name: https, port: {{ .Values.service.port }}, targetPort: https, protocol: TCP }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rp.fullname" . }}-agents
  labels: {{- include "rp.labels" . | nindent 4 }}
  {{- with .Values.agentService.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.agentService.type }}
  selector: {{- include "rp.selector" . | nindent 4 }}
  {{- with .Values.agentService.loadBalancerSourceRanges }}
  loadBalancerSourceRanges: {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - { name: agents, port: {{ .Values.agentService.port }}, targetPort: agents, protocol: TCP }
{{- if .Values.metrics.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rp.fullname" . }}-metrics
  labels: {{- include "rp.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector: {{- include "rp.selector" . | nindent 4 }}
  ports:
    - { name: metrics, port: {{ .Values.metrics.port }}, targetPort: metrics, protocol: TCP }
{{- end }}
{{- if .Values.media.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rp.fullname" . }}-media
  labels: {{- include "rp.labels" . | nindent 4 }}
spec:
  type: LoadBalancer
  selector: {{- include "rp.selector" . | nindent 4 }}
  ports:
    - { name: media, port: {{ .Values.media.udpPort }}, targetPort: media, protocol: UDP }
{{- end }}
