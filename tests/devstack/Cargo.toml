[package]
name = "radio-devstack"
description = "Development only: simulators, agents, gateway and a test token issuer in one process, for UI work without hardware"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "radio-devstack"
path = "src/main.rs"

[dependencies]
api-gateway.workspace = true
platform-auth = { workspace = true, features = ["testing"] }
platform-common.workspace = true
platform-storage.workspace = true
scanner-agent.workspace = true
sds-simulator.workspace = true
axum.workspace = true
rcgen.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-util.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
http-body-util = "0.1"
ipnet.workspace = true
media-gateway.workspace = true
scanner-recorder.workspace = true
scanner-transcription.workspace = true

[lints]
workspace = true
