[workspace]
resolver = "3"
members = [
    "crates/uniden-protocol",
    "crates/uniden-sds",
    "crates/platform-common",
    "crates/platform-auth",
    "crates/platform-storage",
    "crates/scanner-telemetry",
    "crates/scanner-controller",
    "services/api-gateway",
    "services/scanner-agent",
    "tests/simulator",
    "tests/interoperability",
    "tests/devstack",
    "crates/scanner-audio",
    "services/media-gateway",
    "crates/scanner-recorder",
    "crates/scanner-transcription",
    "tests/benches",
]
# cargo-fuzz targets require a nightly toolchain and are built separately.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
uniden-protocol = { path = "crates/uniden-protocol" }
uniden-sds = { path = "crates/uniden-sds" }
sds-simulator = { path = "tests/simulator" }
platform-common = { path = "crates/platform-common" }
platform-auth = { path = "crates/platform-auth" }
platform-storage = { path = "crates/platform-storage" }
scanner-telemetry = { path = "crates/scanner-telemetry" }
scanner-controller = { path = "crates/scanner-controller" }
api-gateway = { path = "services/api-gateway" }
scanner-agent = { path = "services/scanner-agent" }
scanner-audio = { path = "crates/scanner-audio" }
media-gateway = { path = "services/media-gateway" }
scanner-recorder = { path = "crates/scanner-recorder" }
scanner-transcription = { path = "crates/scanner-transcription" }

async-trait = "0.1"
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys"] }
opus = "0.4"
axum = { version = "0.8", features = ["ws", "macros"] }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
governor = "0.10"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "tokio", "service"] }
ipnet = { version = "2", features = ["serde"] }
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs", "use_pem"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time", "json", "migrate", "macros", "ipnet"] }
time = { version = "0.3", features = ["serde", "serde-well-known", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "logging"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "limit", "timeout", "request-id", "util", "fs", "set-header"] }
utoipa = { version = "5", features = ["axum_extras", "uuid", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
x509-parser = "0.17"

proptest = "1.12"
quick-xml = "0.42"
thiserror = "2"
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
